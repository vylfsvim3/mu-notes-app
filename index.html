<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Ноты — автолистание</title>

<!--
  ОДИН ФАЙЛ. Открывается двойным кликом в браузере, кладётся на любой хостинг как index.html.
  Ставится на телефон: «Поделиться → На экран Домой» (Safari) / «Добавить на главный экран» (Chrome).

  МОНЕТИЗАЦИЯ — где что вставлять:
  1) #ad-top    — верхний баннер. Вставьте код AdSense или РСЯ внутрь этого div.
  2) #ad-bottom — нижний sticky-баннер 320x50, самый доходный на мобильных.
  3) В режиме «Сцена» реклама скрывается (body.perf .ad{display:none}) — иначе музыкант
     заденет баннер пальцем вместо переворота. Доход даёт обычный режим просмотра.
  4) Перед публикацией: домен + ads.txt + политика конфиденциальности + cookie-баннер (GDPR/152-ФЗ).
  5) AdSense любит трафик и контент. Голый просмотрщик PDF могут не одобрить — добавьте
     текстовые страницы: «как пользоваться», каталог пьес, статьи. РСЯ (Яндекс) для РФ проще.
  6) Не размещайте тап-зоны поверх рекламы — это «случайные клики», за них банят.

  ЧТО ДОДЕЛАТЬ ПОД PWA (офлайн): скачать pdf.js локально (pdf.min.js + pdf.worker.min.js),
  положить рядом, добавить manifest.json и service-worker.js, заменить ссылки CDN на локальные.
-->

<style>
:root{--bg:#0d0f12;--fg:#e8e8e8;--dim:#8b8f96;--acc:#4da3ff;--bar:#15181d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}

#bar{flex:none;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;
  background:var(--bar);border-bottom:1px solid #22262c;z-index:20}
#bar button,#bar label.btn,#bar select,#bar input{background:#20242b;color:var(--fg);
  border:1px solid #2c313a;border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
#bar button:hover,#bar label.btn:hover{background:#282d36}
#bar button.on{background:var(--acc);color:#04121f;border-color:var(--acc)}
#bar input[type=number]{width:64px;cursor:text}
#bar .lbl{color:var(--dim);font-size:12px}

.ad{flex:none;display:flex;align-items:center;justify-content:center;min-height:64px;
  margin:8px 8px 0;background:#12151a;border:1px dashed #2b313a;border-radius:10px;
  color:#5d646e;font-size:11px;letter-spacing:.1em;text-transform:uppercase;overflow:hidden}
#ad-bottom{margin:8px}

#viewer{flex:1;overflow-y:auto;padding:8px 8px 40px;-webkit-overflow-scrolling:touch}
.page{display:block;margin:0 auto 10px;background:#fff;border-radius:4px;box-shadow:0 2px 14px #0008}

#hint{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim);text-align:center;padding:24px;pointer-events:none;line-height:1.7}

#zones{position:fixed;inset:0;display:none;z-index:15}
#zones .z{position:absolute;top:0;bottom:0;width:38%;-webkit-tap-highlight-color:transparent}
#zones .left{left:0}
#zones .right{right:0}

body.perf #zones{display:block}
body.perf .ad{display:none}
body.perf #bar{position:fixed;bottom:0;top:auto;width:100%;opacity:.12;transition:opacity .2s}
body.perf #bar:hover{opacity:1}
body.perf #viewer{padding-bottom:76px}
</style>
</head>
<body>

<header id="bar">
  <label class="btn">Открыть PDF<input type="file" id="file" accept="application/pdf" hidden></label>
  <button id="prev" title="Назад (←)">◀</button>
  <button id="next" title="Дальше (→)">▶</button>
  <button id="half" title="Половинный скролл (H)">½</button>
  <select id="mode" title="Режим листания">
    <option value="off">Вручную</option>
    <option value="time">По таймеру</option>
    <option value="scroll">Плавная прокрутка</option>
  </select>
  <span class="lbl">сек</span><input type="number" id="sec" value="20" min="3" max="180" step="1">
  <span class="lbl">px/с</span><input type="number" id="speed" value="24" min="2" max="300" step="2">
  <button id="perf" title="Режим сцены (F)">Сцена</button>
  <button id="lock" title="Не гасить экран">Экран</button>
  <button id="fs" title="Полный экран">⛶</button>
</header>

<!-- ===== РЕКЛАМА: ВЕРХНИЙ БАННЕР ===== -->
<div class="ad" id="ad-top">Реклама 728×90 / responsive</div>

<main id="viewer"></main>

<!-- ===== РЕКЛАМА: НИЖНИЙ STICKY ===== -->
<div class="ad" id="ad-bottom">Реклама 320×50 / responsive</div>

<div id="hint">Откройте PDF с нотами.<br>
Дальше — стрелками, педалью или тапом по краю экрана в режиме «Сцена».</div>

<div id="zones"><div class="z left" title="Назад"></div><div class="z right" title="Дальше"></div></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const viewer = $('#viewer');

let pdfDoc = null;
let offsets = [];
let mode = 'off', secs = 20, speed = 24;
let timer = null, raf = null, lastT = 0, wl = null, perf = false;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

/* ---------- настройки в localStorage ---------- */
function loadPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem('pt-prefs') || '{}');
    if (p.sec) { secs = p.sec; $('#sec').value = secs; }
    if (p.speed) { speed = p.speed; $('#speed').value = speed; }
    if (p.mode) { mode = p.mode; $('#mode').value = mode; }
  }catch(e){}
}
function savePrefs(){
  try{ localStorage.setItem('pt-prefs', JSON.stringify({secs, speed, mode})); }catch(e){}
}

/* ---------- загрузка PDF ---------- */
$('#file').onchange = e => { const f = e.target.files[0]; if (f) openFile(f); };

async function openFile(file){
  if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) {
    alert('Нужен PDF'); return;
  }
  $('#hint').style.display = 'none';
  stopAuto();
  viewer.innerHTML = '';
  try{
    const buf = await file.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({data: buf}).promise;
    await renderAll();
  }catch(err){
    alert('Не удалось открыть PDF: ' + err.message);
  }
}

async function renderAll(){
  if (!pdfDoc) return;
  viewer.innerHTML = '';
  const w = Math.max(320, viewer.clientWidth - 16);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  for (let i = 1; i <= pdfDoc.numPages; i++){
    const page = await pdfDoc.getPage(i);
    const v1 = page.getViewport({scale: 1});
    const vp = page.getViewport({scale: w / v1.width});
    const c = document.createElement('canvas');
    c.className = 'page';
    c.width  = Math.floor(vp.width  * dpr);
    c.height = Math.floor(vp.height * dpr);
    c.style.width  = vp.width  + 'px';
    c.style.height = vp.height + 'px';
    viewer.appendChild(c);
    await page.render({
      canvasContext: c.getContext('2d'),
      viewport: vp,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
    }).promise;
  }
  measure();
}

/* ---------- навигация ---------- */
function measure(){
  offsets = [...viewer.querySelectorAll('.page')].map(c => c.offsetTop);
}
function idx(){
  let i = 0;
  for (let k = 0; k < offsets.length; k++) if (viewer.scrollTop + 8 >= offsets[k]) i = k;
  return i;
}
function goTo(i){
  if (!offsets.length) return;
  i = Math.max(0, Math.min(offsets.length - 1, i));
  viewer.scrollTo({top: Math.max(0, offsets[i] - 6), behavior: 'smooth'});
}
function next(){ goTo(idx() + 1); }
function prev(){ goTo(idx() - 1); }
function half(){ viewer.scrollBy({top: viewer.clientHeight * 0.5, behavior: 'smooth'}); }

/* ---------- авто-листание ---------- */
function stopAuto(){
  clearInterval(timer); timer = null;
  if (raf) cancelAnimationFrame(raf); raf = null;
}
function startAuto(){
  stopAuto();
  if (mode === 'time'){
    timer = setInterval(next, secs * 1000);
  } else if (mode === 'scroll'){
    lastT = performance.now();
    const step = t => {
      const dt = (t - lastT) / 1000; lastT = t;
      viewer.scrollTop += speed * dt;
      if (viewer.scrollTop + viewer.clientHeight >= viewer.scrollHeight - 2) viewer.scrollTop = 0;
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
}

/* ---------- кнопки ---------- */
$('#prev').onclick = prev;
$('#next').onclick = next;
$('#half').onclick = half;
$('#mode').onchange  = e => { mode  = e.target.value; savePrefs(); startAuto(); };
$('#sec').onchange   = e => { secs  = Math.max(3, +e.target.value || 20); savePrefs(); startAuto(); };
$('#speed').onchange = e => { speed = Math.max(2, +e.target.value || 24); savePrefs(); startAuto(); };

async function togglePerf(){
  perf = !perf;
  document.body.classList.toggle('perf', perf);
  $('#perf').classList.toggle('on', perf);
  try{
    if (perf && !document.fullscreenElement) await document.documentElement.requestFullscreen();
    else if (!perf && document.fullscreenElement) await document.exitFullscreen();
  }catch(e){}
  setTimeout(measure, 350);
}
$('#perf').onclick = togglePerf;
$('#fs').onclick = togglePerf;

async function toggleLock(){
  try{
    if (wl){ await wl.release(); wl = null; $('#lock').classList.remove('on'); return; }
    wl = await navigator.wakeLock.request('screen');
    $('#lock').classList.add('on');
    wl.addEventListener('release', () => { wl = null; $('#lock').classList.remove('on'); });
  }catch(e){ alert('Этот браузер не умеет держать экран включённым'); }
}
$('#lock').onclick = toggleLock;

/* ---------- тап-зоны (работают только в режиме сцены) ---------- */
$('#zones .right').addEventListener('click', next);
$('#zones .left').addEventListener('click', prev);

/* ---------- клавиатура и Bluetooth-педаль ---------- */
addEventListener('keydown', e => {
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  const k = e.key;
  if (['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){ e.preventDefault(); next(); }
  else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); prev(); }
  else if (k === 'h' || k === 'H') half();
  else if (k === 'f' || k === 'F') togglePerf();
});

/* ---------- resize и drag&drop ---------- */
let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(async () => {
    if (!pdfDoc) return;
    const top = viewer.scrollTop;
    await renderAll();
    viewer.scrollTop = top;
  }, 400);
});
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) openFile(f);
});

loadPrefs();
</script>
</body>
</html>
